name: CI

# 用途：PR 上唯一「獨立於 agent」的綠燈訊號。
#
# TDD Develop 的 agent 會在自己的 job 裡跑測試、再自己在 PR 內文回報「全綠」——
# 那是同一個來源的自我陳述。CLAUDE.md 禁止刪測試、`.skip` / `.only`、竄改斷言，
# 但少了第二個來源就只有人類肉眼在把關。這支重跑一次同樣的檢查，動過手腳的 PR
# 會在這裡露餡。
#
# 這支「不」呼叫 agent，也不碰任何 secret：純粹裝依賴、跑四項檢查。
# 因此它不需要 environment 的人工核准，每個 PR 都會自動跑完。
on:
  pull_request:
  push:
    branches: [main]

# 只讀。這支不寫 repo、不留言、不動 label——
# 一旦要了寫入權限，PR 上的自動檢查就成了一條寫入管道。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR 上連續推 commit 時取消舊的跑；main 上不取消，
  # 每個進入 main 的 commit 都要留下自己的結論。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # job id 就是 check run 的名字，也是 branch ruleset 裡 required status check
  # 要挑的那個字串。取一個看得懂的名字，設定頁上才分辨得出來——
  # 改名會讓已設定的 required check 永遠等不到回報，要改請連同 ruleset 一起改。
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issue #62：只給 migration diff 與 CI build 用的短命資料庫，不連 Neon。
    # service container 每個 run 都是新的，結束後由 GitHub Actions 一併銷毀。
    services:
      shadow:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      # migrate diff 會建立資料表但不寫 Prisma migration history；build 必須使用另一個
      # 空資料庫，才會真的驗到 migrate deploy 在全新環境可從頭套用。
      build-db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5433:5432
    steps:
      # fetch-depth: 0 是給下方「跨瀏覽器提醒」那一步用的：它要比對這個 PR 動了
      # 哪些檔案，而預設的淺 clone 拿不到 base 那一端的 commit。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 前置與 tdd-develop.yml 對齊：那邊跑得起來、這邊也要跑得起來，
      # 否則綠燈與 agent 的實際環境不是同一件事。
      # pnpm/action-setup 要在 setup-node 之前，setup-node 的 cache: pnpm 才找得到 store。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile：lockfile 與 package.json 對不上就失敗，
      # 而不是默默解析出一組跟本機不同的依賴。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 不需要連得到資料庫，只是把 @prisma/client 的型別生出來——
      # 少了這步 typecheck 會以「找不到型別」這種無關的理由紅。
      - name: Prisma generate
        run: pnpm prisma generate

      # schema.prisma 與 migrations 任一邊漏進版控時，prisma generate 仍會正常通過。
      # migrate diff 將 migrations 疊到 shadow DB 後與 datamodel 比對，--exit-code 讓
      # 有差異時 CI 失敗。這個 URL 只指向上方 service，不是 Neon 的環境設定。
      - name: Prisma migration drift
        if: ${{ !cancelled() }}
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      # 四項檢查各自一個步驟，且都掛 !cancelled()：
      # 前一項失敗時後面的照跑，一輪就把四個訊號都看齊。
      # 步驟本身仍然會讓 job 失敗，這裡放寬的只是「要不要跑」，不是「算不算過」。
      # 用 !cancelled() 而不是 always()：run 被取消時就不必再耗 runner。
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # 這個 job 沒有 DATABASE_URL。unit 測試一律 mock Prisma Client，
      # 這正是 tdd-develop.yml prompt 對 agent 的要求——在這裡變成強制的。
      #
      # E2E 不在這裡：需要瀏覽器與 Vercel preview URL，是另一條流程（見 #23）。
      # vitest.config.ts 已 exclude tests/e2e/**，所以 pnpm test 不會誤收 Playwright spec。
      #
      # issue #35：測試套件內的斷言守不住「整套測試都沒被 Vitest 收到」。因此由
      # pnpm test 這次實際執行同時產生 JSON result，再由測試套件外的腳本確認：
      # package scripts 沒被放寬、測試案例不為零，且 tests/unit 每個測試檔至少有
      # 一個案例。default reporter 保留可讀的 CI log；JSON reporter 只負責寫檔。
      - name: Unit tests
        if: ${{ !cancelled() }}
        env:
          VITEST_RESULT_FILE: ${{ runner.temp }}/vitest-result.json
        run: |
          pnpm test --reporter=default --reporter=json --outputFile.json="$VITEST_RESULT_FILE"
          node .github/scripts/assert-vitest-discovery.mjs "$VITEST_RESULT_FILE"

      # issue #176：resizeAvatar 整段建立在 createImageBitmap / canvas / toBlob 上，
      # happy-dom 三個都沒有，unit 測試只能對著替身斷言。而它原本的真實瀏覽器覆蓋
      # 來自 E2E，在「訪客不得上傳頭像」定案後沒了（preview 上只有訪客登得進去）。
      #
      # 這一步把「需要真實瀏覽器」與「需要真實部署」分開：不起 server、不登入、
      # 不碰 Blob store，只在真的 Chromium 裡跑 tests/browser/。
      # 只裝 chromium，與 e2e.yml 同一個理由——設定裡也只有這一個。
      - name: Install Chromium for browser tests
        if: ${{ !cancelled() }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        if: ${{ !cancelled() }}
        run: pnpm test:browser

      # issue #187：上一步只跑 Chromium，抓不到 Safari 專屬的行為。
      #
      # 決定是「不把 WebKit 加進 CI」——Linux 上的 Playwright WebKit 不等於真的
      # iOS Safari，而分不清是真 bug 還是 provider 差異的紅燈，會慢慢被當成雜訊。
      # 代價是那一類問題只有人工實機驗得到，而「人工」最容易失敗的地方是沒人想起來。
      #
      # 所以在**唯一該想起來的時刻**出聲：有人動到縮圖那段程式碼的時候。
      # 這一步永遠成功，只留一則 warning 與一段 summary——它是提醒，不是閘門。
      # PR #185 踩過的兩個坑（imageOrientation 的列舉、toBlob 安靜退成 PNG）
      # 都是改到這個檔案時才會踩到的，範圍抓在這裡剛好。
      - name: Cross-browser reminder
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WATCHED: app/utils/avatarImage.ts
        run: |
          if ! git diff --name-only "$BASE_SHA" HEAD -- "$WATCHED" | grep -q .; then
            echo "沒有動到 $WATCHED，不需要跨瀏覽器的人工確認。"
            exit 0
          fi

          MESSAGE="這個 PR 動到 $WATCHED。自動化只跑 Chromium，Safari 專屬的行為蓋不到（見 docs/BROWSER_TESTS.md 與 issue #187），請在實機上確認一次：選一張相機拍的橫向照片，上傳後方向正確、而且沒有跳出「無法縮小」之類的訊息。"

          echo "::warning file=$WATCHED::$MESSAGE"
          {
            echo "### ⚠️ 需要一次人工的跨瀏覽器確認"
            echo
            echo "$MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      # 「只有打包才會炸」的錯誤，前面三項一個都攔不到——例如 app/ 用相對路徑
      # 跨出 srcDir 匯入根目錄的 shared/：原始碼位置正確，所以 typecheck 全綠，
      # 錯誤只發生在 Nitro 把 Vite 的 chunk 搬家之後再打包一次的那一刻（見 #43、#44）。
      # 少了這一步，那一整類問題要等 Vercel 的 preview deployment 才會紅，
      # 而 Vercel 的 log 要點進 dashboard 才看得到。
      #
      # 放在最後：前面三項是秒級的快訊號，先讓它們回報完，再花 30–60 秒打包。
      # `pnpm build` 先 migrate deploy、再 generate 與 Nuxt build。CI 使用與 drift
      # service 分離的空資料庫驗證同一條指令，不連 Neon；Vercel 則由其 Production /
      # Preview scope 的 DATABASE_URL 與 DIRECT_URL 對應套用到各自的 Neon 分支。
      # preset 照 nuxt.config.ts 用 vercel，驗的就是實際部署的目標環境。
      - name: Build
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5433/postgres
        run: pnpm build
